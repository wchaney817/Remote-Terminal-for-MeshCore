<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MCTerm" />
    <meta name="theme-color" content="#111419" />
    <meta
      name="description"
      content="Web interface for MeshCore mesh radio networks. Send and receive messages, manage contacts and channels, and configure your radio."
    />
    <title>RemoteTerm for MeshCore</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" crossorigin="use-credentials" />
    <script>
      // Service worker registration moved to main.tsx (requires isSecureContext
      // for Web Push). Do not duplicate here.

      // Start critical data fetches before React/Vite JS loads.
      // Must be in <head> BEFORE the module script so the browser queues these
      // fetches before it discovers and starts downloading the JS bundle.
      // React hooks consume the promises via window.__prefetch.
      // Duplicated from src/utils/authRedirect.ts (that module doesn't exist
      // yet at this point in page load) — keep the key and fallback behavior
      // in sync with that file if either changes. This is the earliest place
      // a 401/403 (an expired reverse-proxy session) can be caught, since
      // these fetches fire before any other request. See issue #346.
      var AUTH_REDIRECT_KEY = 'remoteterm-auth-redirect-url';
      var hasRedirectedForAuth = false;
      var triggerAuthRedirectFromPrefetch = function () {
        if (hasRedirectedForAuth) return;
        hasRedirectedForAuth = true;
        var url = null;
        try {
          url = localStorage.getItem(AUTH_REDIRECT_KEY);
        } catch {
          // localStorage may be unavailable
        }
        if (url) {
          window.location.href = url;
        } else {
          window.location.reload();
        }
      };

      var fetchJsonOrThrow = function (url) {
        return fetch(url)
          .then(function (response) {
            if (response.ok) {
              return response.json();
            }
            if (response.status === 401 || response.status === 403) {
              triggerAuthRedirectFromPrefetch();
            }
            return response.text().then(function (rawError) {
              var message = rawError || response.statusText || 'HTTP ' + response.status;
              try {
                var parsed = JSON.parse(rawError);
                if (parsed && typeof parsed.detail === 'string' && parsed.detail.length > 0) {
                  message = parsed.detail;
                }
              } catch {
                // Keep raw text fallback when body is not JSON.
              }
              throw new Error('Prefetch failed for ' + url + ': ' + message);
            });
          })
          .catch(function (err) {
            console.error(err);
            throw err;
          });
      };
      window.__prefetch = {
        config: fetchJsonOrThrow('./api/radio/config'),
        settings: fetchJsonOrThrow('./api/settings'),
        channels: fetchJsonOrThrow('./api/channels'),
        contacts: fetchJsonOrThrow('./api/contacts?limit=1000&offset=0'),
        unreads: fetchJsonOrThrow('./api/read-state/unreads'),
        undecryptedCount: fetchJsonOrThrow('./api/packets/undecrypted/count'),
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
